# One-click Render deploy: chat only, no configuration page.
# 1. Push this repo to your GitHub. 2. In Render choose New > Blueprint and pick the repo.
# 3. Select the AI provider in app.yaml first. Default minimal app = offline Demo.
#    A key alone does not switch mock to OpenAI. Paste a key only for the selected provider.
services:
  - type: web
    name: customchat
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: CUSTOMCHAT_CONFIG
        value: "off"
      - key: OPENAI_API_KEY
        sync: false
      - key: PORT
        value: "8080"
    disk:
      name: chatdata
      mountPath: /app/apps/minimal/data
      sizeGB: 1
