<!doctype html>
<html lang="en" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="theme-color" content="{{ACCENT}}">
<style>:root{--accent:{{ACCENT}};--accent2:{{ACCENT2}}}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Fraunces:wght@600;700&display=swap">
<link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/motion.css">
<script id="cc-theme" type="application/json">{{THEME_JSON}}</script>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/customselect.css"><script src="/customselect.js" defer></script></head>
<body>
<a class="skip" href="#q">Skip to question box</a>
<header class="toolbar"><div class="tb-brand" id="brand"></div><a class="tb-link" href="/settings.html">Configuration</a><span class="badge" id="modelBadge"></span><button class="theme-btn" id="themeBtn" aria-label="Toggle theme"><i></i></button></header>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="side-head">
      <div class="side-title" id="sideTitle"></div>
      <button class="icon side-close" id="sideClose" aria-label="Close chats" title="Close">&times;</button>
      <button class="btn-dark" id="newChat" title="New chat" aria-label="New chat">New chat</button>
      <button class="btn-out" id="tempPill" title="Temporary chat: nothing is saved">Temporary</button>
    </div>
    <input class="search" id="search" type="search" placeholder="Search chats" aria-label="Search chats">
    <div class="tabs" role="tablist"><button class="tab on" data-tab="chats">Chats</button><button class="tab" data-tab="topics">Topics</button></div>
    <nav class="list" id="list" aria-label="History"></nav>
    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>
    <div class="note"><strong id="noteName"></strong><span id="noteText"></span></div>
  </aside>
  <main class="main">
    <header class="bar">
      <button class="icon menu" id="menu" aria-label="Menu"></button>
      <span class="status"></span><div class="title" id="chatTitle">New chat</div>
      <div class="bar-r"><select id="style" aria-label="Answer depth"></select><button class="icon" id="prevQ" title="Previous question (k)" aria-label="Previous question"></button><button class="icon" id="nextQ" title="Next question (j)" aria-label="Next question"></button><button class="icon" id="tempBtn" hidden title="Temporary chat: nothing is saved" aria-label="Temporary chat" aria-pressed="false">◔</button><button class="icon" id="profileBtn" title="My profile" aria-label="My profile">☺</button><button class="icon" id="newTopic" title="Start a new conversation in this chat" aria-label="New conversation"></button><button class="icon" id="exportChat" title="Export chat as Markdown" aria-label="Export chat">⤓</button></div>
    </header>
    <section class="thread" id="thread" role="log" aria-live="polite" aria-label="Conversation"></section>
    <button class="jump" id="jump" aria-label="Scroll to latest"></button>
    <footer class="composer">
      <div class="pills" id="similar" aria-label="Asked before"></div>
      <div class="pills" id="pills"></div>
      <div class="box">
        <button class="icon" id="upload" title="Add a text file as a source" aria-label="Add file"></button>
        <button class="icon" id="mic" title="Dictate" aria-label="Dictate" hidden></button>
        <textarea id="q" rows="1" placeholder="Ask a question" aria-label="Question" maxlength="2000"></textarea>
        <button class="send" id="send" aria-label="Send"></button>
      </div>
      <div class="cmeta"><span id="hint"></span><span>Not a substitute for professional advice.</span></div>
    </footer>
  </main>
  <aside class="sources" id="sources" aria-label="Sources"></aside>
</div>
<script src="/app.js"></script>
</body>
</html>
