<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{CODE}} {{TITLE}}</title>
<style>:root{--bg:#f6f2e8;--ink:#173f35;--mut:#5d6b64;--line:#d9d6c8;--acc:#173f35}@media(prefers-color-scheme:dark){:root{--bg:#0f1a17;--ink:#e6efe9;--mut:#9db0a7;--line:#27413a;--acc:#9fd9b4}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 "DM Sans",system-ui,sans-serif;padding:24px}
main{max-width:460px;text-align:center;animation:up .3s cubic-bezier(.22,1,.36,1) both}@keyframes up{from{opacity:0;transform:translateY(8px)}}
svg{width:150px;height:150px;margin-bottom:6px;color:var(--acc)}.code{font:600 13px "DM Sans",sans-serif;letter-spacing:.14em;color:var(--mut)}
h1{font-family:Fraunces,Georgia,serif;font-size:30px;margin:6px 0 8px}p{color:var(--mut);margin:0 0 24px}
a{display:inline-block;padding:11px 22px;border-radius:12px;background:var(--acc);color:var(--bg);text-decoration:none;font-weight:700;transition:transform .14s}a:hover{transform:translateY(-1px)}a:active{transform:scale(.985)}a.q{background:none;color:var(--ink);border:1px solid var(--line);margin-left:8px}
.f{float-animation:none}@media(prefers-reduced-motion:reduce){main{animation:none}}</style></head><body><main>
<svg viewBox="0 0 150 150" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{{ART}}</svg>
<div class="code">ERROR {{CODE}}</div><h1>{{TITLE}}</h1><p>{{MSG}}</p><a href="/">Back to chat</a><a class="q" href="javascript:history.back()">Go back</a></main></body></html>
