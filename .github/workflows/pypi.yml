name: PyPI release (manual)
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload verified artifacts to PyPI (requires pending trusted publisher)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with: {name: python-distributions, path: dist/}
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - uses: actions/download-artifact@v4
        with: {name: python-distributions, path: dist/}
      - run: python tests/release_install.py
      - name: Fresh-computer uvx bootstrap
        run: python tests/start_bootstrap.py
      - name: Real absent-uv bootstrap
        run: python tests/absent_uv.py
  publish:
    if: ${{ inputs.publish }}
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: python-distributions, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
