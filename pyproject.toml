[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "customchat-app"
version = "0.1.16"
readme = "README.md"
description = "Chat with your documents. One YAML file, cited answers, offline demo."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.3,<7"]
license = {text = "MIT"}

[project.scripts]
customchat = "customchat.cli:main"
customchat-app = "customchat.cli:main"

[tool.setuptools.packages.find]
include = ["customchat*"]

[tool.setuptools.package-data]
customchat = ["web/*", "web/logos/*.svg", "web/icons/*.svg", "web/team/*.jpg", "web/emoji/*", "templates/minimal/app.yaml", "templates/minimal/docs/*.md"]

[project.urls]
Repository = "https://github.com/Harsh23Kashyap/customchat"

[project.optional-dependencies]
documents = ["pypdf>=4"]
semantic = ["sentence-transformers>=3"]
